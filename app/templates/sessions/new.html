{% extends "base.html" %}
{% block title %}New Session — Climbing Tracker{% endblock %}

{% block content %}
<h2 style="margin-top: 1rem;">New Session</h2>

<form method="post" action="/sessions">
    <div class="form-row">
        <div class="form-section">
            <label for="date">Date</label>
            <input type="date" name="date" id="date" value="{{ today }}" required>
        </div>
        <div class="form-section">
            <label for="time">Time</label>
            <input type="time" name="time" id="time" value="{{ now_time }}">
        </div>
    </div>

    <div class="form-section">
        <label for="gym">Gym</label>
        <input type="text" name="gym" id="gym" list="gym-list" required placeholder="Gym name">
        <datalist id="gym-list">
            {% for g in gyms %}
            <option value="{{ g }}">
            {% endfor %}
        </datalist>
    </div>

    <div class="form-row">
        <div class="form-section">
            <label for="duration_minutes">Duration (min)</label>
            <input type="number" name="duration_minutes" id="duration_minutes" value="90" min="1" required>
        </div>
        <div class="form-section">
            <label>Energy</label>
            <div class="btn-group" id="energy-group">
                {% for i in range(1, 6) %}
                <button type="button" class="btn-option energy-opt {% if i == 3 %}selected{% endif %}"
                        data-value="{{ i }}" onclick="selectOne(this, 'energy-group', 'energy_level')">
                    {{ i }}
                </button>
                {% endfor %}
            </div>
            <input type="hidden" name="energy_level" id="energy_level" value="3">
        </div>
    </div>

    <div class="form-section">
        <label for="body_notes">Body notes <span class="text-muted">(optional)</span></label>
        <input type="text" name="body_notes" id="body_notes" placeholder="Injuries, soreness, etc.">
    </div>

    <button type="submit">Create Session</button>
</form>
{% endblock %}

{% block scripts %}
<script>
function selectOne(btn, groupId, hiddenId) {
    document.querySelectorAll('#' + groupId + ' .btn-option').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    document.getElementById(hiddenId).value = btn.dataset.value;
}
</script>
{% endblock %}
