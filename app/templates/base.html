<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a1a2e">
    <title>{% block title %}Climbing Tracker{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="/static/css/custom.css">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
</head>
<body>
    <nav class="top-nav">
        <a href="/" class="brand">Climbing Tracker</a>
        <div class="nav-links">
            <a href="/" role="button" class="outline secondary">Sessions</a>
            <a href="/sessions/new" role="button">+ New</a>
        </div>
    </nav>

    <main class="container">
        <div id="flash-area">
        {% if flash_message %}
            <div class="flash-message flash-{{ flash_type|default('success') }}">
                {{ flash_message }}
            </div>
        {% endif %}
        </div>
        {% block content %}{% endblock %}
    </main>

    {% block scripts %}{% endblock %}
</body>
</html>
